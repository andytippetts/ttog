<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TTOG</title>
<meta name="description" content="Tippetts Tournament of Games">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Righteous&display=swap">
<style>
/* Layout: the scoreboard is a board-game score track; each player's pawn sits on their points.
   Colors are the logo's pawns on its heavy ink outline. */
:root{
  --ink:#13202a; --paper:#eef3f4; --card:#fff; --line:#c9d5d9; --soft:#52636d;
  --blue:#2f76b5; --green:#2f7d38; --orange:#ee6a3c; --yellow:#f5b347; --bad:#b3261e;
  --display:"Righteous","Avenir Next",system-ui,sans-serif; --body:"Figtree","Avenir Next",system-ui,sans-serif;
  --g:max(16px,env(safe-area-inset-left,0px));
}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--body);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.35rem} h3{font-size:1.05rem} p{margin:0}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding-inline:var(--g)}
header.top{background:var(--card);border-bottom:3px solid var(--ink)}
header.top .wrap{display:flex;align-items:center;gap:16px;min-height:68px}
header.top img{height:54px;width:auto;display:block}
header.top .yr{margin-left:auto;font-family:var(--display);font-size:1.4rem}
nav{position:fixed;inset:auto 0 0;background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;display:flex}
nav a{flex:1;text-align:center;color:#c6d3d9;text-decoration:none;padding:14px 2px 13px;font-weight:600;font-size:.86rem;border-top:4px solid transparent}
nav a[aria-current]{color:#fff;border-top-color:var(--yellow)}
main{display:grid;gap:26px;padding-block:26px}
main>*{min-width:0}
section{display:grid;gap:14px} section>*{min-width:0}
.sub{color:var(--soft)} .small{font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center} .push{margin-left:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:14px}
button,.btn{font:600 1rem/1.2 var(--body);color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:11px 16px;min-height:46px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.main{background:var(--green);color:#fff;border-color:var(--ink)}
button.plain{border-color:transparent;background:none;text-decoration:underline;text-underline-offset:3px;padding-inline:8px}
button.bad{color:var(--bad);border-color:var(--bad)} button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,select{font:400 1rem var(--body);color:var(--ink);background:#fff;border:2px solid #8698a1;border-radius:6px;padding:10px 12px;min-height:46px;width:100%}
input[type=color]{padding:3px;width:52px;flex:none} input[type=checkbox]{width:24px;height:24px;min-height:0;flex:none;margin:0;accent-color:var(--green)}
label{display:grid;gap:5px;font-weight:600}
.pawn{width:26px;height:34px;flex:none;display:block} .pawn path{stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
/* score track */
.track{background:var(--card);border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.lane{display:grid;grid-template-columns:40px 1fr auto;grid-template-areas:"r n p" "t t t";column-gap:10px;padding:10px 14px 0;border-top:1px solid var(--line)}
.lane:first-child{border-top:0}
.lane .r{grid-area:r;font-family:var(--display);font-size:1.3rem} .lane .n{grid-area:n;font-weight:800;overflow-wrap:anywhere}
.lane .n span{font-weight:400;color:var(--soft);font-size:.85rem;margin-left:6px}
.lane .p{grid-area:p;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.lane .t{grid-area:t;position:relative;height:42px;margin:0 13px}
.lane .sq{position:absolute;inset:auto -13px 8px;height:14px;border:1.5px solid var(--ink);border-radius:3px;background:repeating-linear-gradient(90deg,#fff 0 calc(var(--step) - 1.5px),#9fb0b8 calc(var(--step) - 1.5px) var(--step))}
.lane .fill{position:absolute;left:-13px;bottom:8px;height:14px;border:1.5px solid var(--ink);border-radius:3px 0 0 3px;transition:width .9s}
.lane .pawn{position:absolute;bottom:9px;margin-left:-13px;transition:left .9s}
.lane.lead{background:#fff6e3}
/* current game */
.now{background:var(--ink);color:#fff;border-radius:8px;padding:22px 20px;text-align:center;display:grid;gap:6px}
.now .lbl{color:var(--yellow);font-weight:600} .now .name{font-family:var(--display);font-size:clamp(1.9rem,7vw,3rem);line-height:1.1;overflow-wrap:anywhere;min-height:1.1em}
.now.champ{background:var(--yellow);color:var(--ink)} .now.champ .lbl{color:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0} .list li:first-child{border-top:0}
.list .gn{font-weight:600;overflow-wrap:anywhere;min-width:0} .tag{font-size:.85rem;color:var(--soft);white-space:nowrap}
.cols{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
details{border-top:1px solid var(--line);padding:10px 0} details:first-of-type{border-top:0} summary{cursor:pointer;font-weight:600}
details ol{list-style:none;margin:8px 0 2px;padding:0;display:grid;gap:4px} details li{display:flex;gap:10px} details li b{width:2.4em;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px} .chips button{gap:8px;padding-block:8px}
.place{font-family:var(--display);width:2.6em;flex:none;font-size:1.1rem}
table{width:100%;border-collapse:collapse} th,td{text-align:right;padding:9px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums} th:first-child,td:first-child{text-align:left} thead th{border:0;color:var(--soft);font-size:.9rem;font-weight:600}
.scroll{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border:2px solid #fff;padding:12px 18px;border-radius:6px;max-width:calc(100vw - 32px);width:max-content;z-index:20;font-weight:600} #toast.err{background:var(--bad)}
#offline{background:var(--yellow);padding:8px var(--g);text-align:center;font-weight:600}
dialog{border:3px solid var(--ink);border-radius:8px;padding:22px;max-width:min(420px,calc(100vw - 32px));color:var(--ink)} dialog::backdrop{background:#13202acc} dialog form{display:grid;gap:14px}
@media(min-width:720px){body{padding-bottom:30px} nav{position:static;padding:0} nav .wrap{display:flex;gap:26px} nav a{flex:none;padding:13px 2px;font-size:1rem;border-top:0;border-bottom:4px solid transparent} nav a[aria-current]{border-bottom-color:var(--yellow)} #toast{bottom:24px}
 .lane{grid-template-columns:44px 190px 1fr 70px;grid-template-areas:"r n t p";align-items:center;padding-block:6px} .lane .p{text-align:right} .lane .n span{display:block;margin:0}}
@media(max-width:719px){nav .wrap{display:contents}}
/* TV */
body.tv{background:var(--ink);padding:0;min-height:100vh} body.tv header.top,body.tv nav,body.tv #foot{display:none}
body.tv .wrap{max-width:none} body.tv main{padding:2.4vw;grid-template-columns:1.7fr 1fr;gap:2.4vw;min-height:100vh;align-content:center}
body.tv .track{border-color:#fff} body.tv .lane{grid-template-columns:4.2vw 15vw 1fr 6.5vw;grid-template-areas:"r n t p";align-items:center;padding:.5vw 1.4vw} body.tv .lane .r,body.tv .lane .p{font-size:2.5vw} body.tv .lane .p{text-align:right} body.tv .lane .n{font-size:1.9vw;line-height:1.2} body.tv .lane .n span{display:none} body.tv .lane .t{height:4.2vw} body.tv .lane .sq,body.tv .lane .fill{height:1.4vw} body.tv .lane .pawn{width:2.8vw;height:3.6vw;margin-left:-1.4vw}
body.tv .side{display:grid;gap:2vw;align-content:center;justify-items:center;text-align:center;color:#fff} body.tv .side img{width:19vw;background:#fff;border-radius:1vw;padding:1vw}
body.tv .now{border:3px solid var(--yellow);width:100%;padding:2vw 1.4vw} body.tv .now .name{font-size:3.4vw} body.tv .now{font-size:1.5vw} body.tv .sub{color:#c6d3d9;font-size:1.5vw}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="#/" aria-label="Scoreboard"><img src="ttog-logo.png" alt="TTOG, Tippetts Tournament of Games"></a><div class="yr" id="yr"></div></div></header>
<nav aria-label="Main"><div class="wrap" id="nav"></div></nav>
<div id="offline" role="status" hidden>Can't reach the scoreboard right now. Trying again…</div>
<div class="wrap"><main id="main"><p class="sub">Loading the tournament…</p></main></div>
<div id="toast" role="status" hidden></div>
<dialog id="dlg"></dialog>
<script>
// ============ SETTINGS (filled in once, when the site goes online) ============
const LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);
const SUPABASE_URL = LOCAL ? location.origin : "https://dlmkbmtafdoqezzxhqsb.supabase.co";
const SUPABASE_KEY = LOCAL ? "local" : "sb_publishable_kZbtXBNFrrEjxPD5dl1kPQ_eGWb1Nc8";
// ==============================================================================

const $ = s => document.querySelector(s), main = $("#main");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mem = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const ord = n => n + (n % 100 > 10 && n % 100 < 14 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const COLORS = ["#2f76b5", "#2f7d38", "#ee6a3c", "#f5b347", "#8b4fa8", "#d0427a", "#1aa3a3", "#7a5230", "#6b7780", "#c0392b"];
let S = null, raw = "", timer = null, reelTimer = null;
const ui = { year: null, pin: null, game: null, order: [], editing: null };
try { ui.pin = sessionStorage.getItem("ttog-pin"); } catch {}
let device = mem.get("ttog-device");
if (!device) { device = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join(""); mem.set("ttog-device", device); }
const mine = () => { try { return JSON.parse(mem.get("ttog-mine") || "[]"); } catch { return []; } };

async function rpc(name, args = {}) {
  let r;
  try { r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, { method: "POST", headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY }, body: JSON.stringify(args) }); }
  catch { throw new Error("No connection. Check your internet and try again."); }
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error(j?.message || "Something went wrong. Try again.");
  if (j?.error) { if (j.error === "Wrong PIN") setPin(null); throw new Error(j.error); }
  return j;
}
const admin = (name, args) => rpc(name, { p_pin: ui.pin || "", ...args });
function setPin(p) { ui.pin = p; try { p ? sessionStorage.setItem("ttog-pin", p) : sessionStorage.removeItem("ttog-pin"); } catch {} }
let toastT; function toast(m, err) { const t = $("#toast"); t.textContent = m; t.className = err ? "err" : ""; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 5000 : 2600); }
function ask(title, body, yes) {
  const d = $("#dlg");
  d.innerHTML = `<form method="dialog"><h2>${esc(title)}</h2><p>${esc(body)}</p><div class="row"><button value="" autofocus>Cancel</button><button class="bad push" value="yes">${esc(yes)}</button></div></form>`;
  d.returnValue = ""; d.showModal();
  return new Promise(r => d.addEventListener("close", () => r(d.returnValue === "yes"), { once: true }));
}

// ---------- Numbers ----------
const person = id => S.people.find(p => p.id === id) || { name: "Unknown", color: "#888888" };
const yearOf = y => S.years.find(x => x.year === y);
function view(y) {
  const yr = yearOf(y), roster = S.roster.filter(r => r.year === y).map(r => person(r.person)).sort((a, b) => a.name.localeCompare(b.name));
  const games = S.games.filter(g => g.year === y).map(g => ({ ...g, res: S.results.filter(r => r.game === g.id).sort((a, b) => a.place - b.place).map(r => ({ ...r, pts: yr.points[r.place - 1] || 0 })) }));
  const played = games.filter(g => g.res.length), total = yr.rounds * roster.length;
  const all = played.flatMap(g => g.res);
  const board = roster.map(p => { const m = all.filter(r => r.person === p.id); return { p, pts: m.reduce((s, r) => s + r.pts, 0), wins: m.filter(r => r.place === 1).length, games: m.length }; });
  board.forEach(b => b.rank = 1 + board.filter(o => o.pts > b.pts).length);
  board.sort((a, b) => a.rank - b.rank || b.wins - a.wins || a.p.name.localeCompare(b.p.name));
  const done = total > 0 && games.length === total && played.length === total;
  return { yr, roster, games, played, total, board, done, champs: done ? board.filter(b => b.rank === 1).map(b => b.p) : [], cur: games.find(g => g.id === yr.current_game) };
}
const names = ps => ps.map(p => p.name).join(" and ");

// ---------- Pieces ----------
const pawn = (c, style = "") => `<svg class="pawn" viewBox="0 0 26 34" aria-hidden="true" style="${style}"><path fill="${esc(c)}" d="M13 2a6 6 0 0 1 4 10.500c.6 5 3.500 8.500 5.500 12.500 1.500 3 1.500 7-1 7h-17c-2.500 0-2.500-4-1-7 2-4 4.900-7.500 5.500-12.500A6 6 0 0 1 13 2z"/></svg>`;
function track(v) {
  const max = Math.max(30, Math.ceil((Math.max(0, ...v.board.map(b => b.pts)) + 1) / 10) * 10);
  const step = `calc((100% ) * ${5 / max})`;
  return `<div class="track" role="list" aria-label="Standings">` + v.board.map(b => { const x = b.pts / max * 100; return `<div class="lane ${b.rank === 1 && b.pts ? "lead" : ""}" role="listitem"><div class="r">${v.played.length ? b.rank : ""}</div><div class="n">${esc(b.p.name)} <span>${plural(b.wins, "win")}, ${plural(b.games, "game")}</span></div><div class="p">${b.pts}</div><div class="t"><div class="sq" style="--step:${step}"></div>${b.pts ? `<div class="fill" style="width:calc(${x}% + 13px);background:${esc(b.p.color)}"></div>` : ""}${pawn(b.p.color, `left:${x}%`)}</div></div>`; }).join("") + `</div>`;
}
function nowCard(v) {
  if (v.done) return `<div class="now champ"><div class="lbl">${v.yr.year} ${v.champs.length > 1 ? "champions" : "champion"}</div><div class="name">${esc(names(v.champs))}</div><div>${plural(v.board[0].pts, "point")}</div></div>`;
  if (!v.cur) return "";
  return `<div class="now"><div class="lbl">Now playing</div><div class="name" data-reel="${esc(v.cur.id)}">${esc(v.cur.name)}</div><div data-reel-sub>Round ${v.cur.round}, ${esc(person(v.cur.person).name)}'s pick</div></div>`;
}
const places = g => `<ol>${g.res.map(r => `<li><b>${ord(r.place)}</b><span>${esc(person(r.person).name)}</span><span class="push">${plural(r.pts, "point")}</span></li>`).join("")}</ol>`;
const rounds = v => Array.from({ length: v.yr.rounds }, (_, i) => i + 1);

// ---------- Screens ----------
const screens = {
  ""() {
    const v = view(ui.year);
    if (!v.roster.length) return `<section class="panel"><h1>No players yet</h1><p>Open Setup and add everyone playing in ${ui.year}.</p><div><a class="btn" href="#/setup">Go to Setup</a></div></section>`;
    const rs = rounds(v).filter(r => v.played.some(g => g.round === r));
    return `${nowCard(v)}<section><div class="row"><h1>Scoreboard</h1><span class="sub push">${v.played.length} of ${plural(v.total, "game")} played</span></div>${track(v)}<p class="sub small">Points by place: ${v.yr.points.map((p, i) => `${ord(i + 1)} ${p}`).join(", ")}. Tied players get the same points.</p></section>
    ${rs.length ? `<section><h2>Games played</h2><div class="cols">${rs.map(r => `<div class="panel"><h3>Round ${r}</h3><div>${v.played.filter(g => g.round === r).map(g => `<details data-k="${g.id}"><summary>${esc(g.name)}: ${esc(names(g.res.filter(x => x.place === 1).map(x => person(x.person))))} won</summary>${places(g)}</details>`).join("")}</div></div>`).join("")}</div></section>` : ""}
    <p id="foot" class="small"><a href="#/tv">Show on the TV</a></p>`;
  },
  games() {
    const v = view(ui.year), latest = ui.year === S.years[0].year, open = v.yr.open_round;
    let form = "";
    if (latest && v.roster.length) {
      const me = v.roster.find(p => p.id === mem.get("ttog-me"));
      const sel = `<label>Who are you?<select id="me"><option value="">Choose your name</option>${v.roster.map(p => `<option value="${p.id}" ${me?.id === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></label>`;
      let rest = "";
      if (!open) rest = `<p><b>Every game is in.</b> Time to play.</p>`;
      else if (me) {
        const g = v.games.find(g => g.round === open && g.person === me.id);
        const waiting = v.roster.filter(p => !v.games.some(g => g.round === open && g.person === p.id));
        rest = g ? `<p><b>${esc(g.name)}</b> is in for round ${open}. Waiting on ${esc(waiting.map(p => p.name).join(", "))}.</p>` : `<form id="submit" class="row"><label style="flex:1 1 220px">Your game for round ${open}<input id="gname" maxlength="60" autocomplete="off" placeholder="Type the game's name"></label><button class="main" style="align-self:end">Add my game</button></form>`;
      }
      const mineHere = v.games.filter(g => mine().includes(g.id) && !g.res.length && g.id !== v.yr.current_game);
      const edit = mineHere.map(g => ui.editing === g.id ? `<form class="row rename" data-id="${g.id}"><label style="flex:1 1 220px">Round ${g.round} game<input id="rn-${g.id}" value="${esc(g.name)}" maxlength="60"></label><button style="align-self:end" class="main">Save name</button><button style="align-self:end" type="button" data-do="noedit">Cancel</button></form>` : `<div class="row"><span>Round ${g.round}: <b>${esc(g.name)}</b></span><button class="plain" data-do="edit" data-id="${g.id}">Change</button></div>`).join("");
      form = `<section class="panel"><h1>Pick your game</h1>${sel}${rest}${edit ? `<div><h3>Added from this phone</h3>${edit}</div>` : ""}</section>`;
    }
    return form + `<section><h2>Games by round</h2><div class="cols">${rounds(v).map(r => { const gs = v.games.filter(g => g.round === r); return `<div class="panel"><div class="row"><h3>Round ${r}</h3><span class="tag push">${gs.length} of ${v.roster.length} in</span></div>${gs.length ? `<ul class="list">${gs.map(g => `<li>${pawn(person(g.person).color)}<span class="gn">${esc(g.name)}<br><span class="tag">${esc(person(g.person).name)}</span></span><span class="tag push">${g.res.length ? "Played" : g.id === v.yr.current_game ? "Playing now" : ""}</span>${ui.pin && !g.res.length ? `<button class="plain" data-do="delgame" data-id="${g.id}" aria-label="Remove ${esc(g.name)}">Remove</button>` : ""}</li>`).join("")}</ul>` : `<p class="sub">No games yet.</p>`}</div>`; }).join("")}</div></section>`;
  },
  play() {
    if (!ui.pin) return pinForm("Run the game table", "Drawing games and entering scores needs the admin PIN.");
    const v = view(ui.year), pend = v.games.filter(g => !g.res.length), r = Math.min(...pend.map(g => g.round));
    const missing = pend.length ? v.roster.filter(p => !v.games.some(g => g.round === r && g.person === p.id)) : [];
    const owed = v.yr.open_round ? v.roster.filter(p => !v.games.some(g => g.round === v.yr.open_round && g.person === p.id)) : [];
    const g = v.games.find(x => x.id === ui.game);
    return `${nowCard(v)}<section class="panel"><h1>Draw a game</h1>${pend.length ? `<p>${plural(pend.filter(x => x.round === r).length, "game")} left in round ${r}.</p>${missing.length ? `<p><b>Still owed for round ${r}:</b> ${esc(missing.map(p => p.name).join(", "))}. You can draw now, but their games won't be in it.</p>` : ""}<div class="row"><button class="${v.cur ? "" : "main"}" data-do="draw">${v.cur ? "Draw a different game" : "Draw a game"}</button>${v.cur ? `<button class="main" data-do="score" data-id="${v.cur.id}">Enter scores for this game</button>` : ""}</div>` : `<p>${v.done ? "Every game has been played." : "No games are waiting. Add games on the Games screen."}</p>`}</section>
    <section class="panel"><h2>Enter scores</h2><label>Game<select id="pick"><option value="">Choose a game</option>${pend.length ? `<optgroup label="Not played yet">${pend.map(x => `<option value="${x.id}" ${x.id === ui.game ? "selected" : ""}>${esc(x.name)} (round ${x.round})</option>`).join("")}</optgroup>` : ""}${v.played.length ? `<optgroup label="Already scored">${v.played.map(x => `<option value="${x.id}" ${x.id === ui.game ? "selected" : ""}>${esc(x.name)} (round ${x.round})</option>`).join("")}</optgroup>` : ""}</select></label>${g ? scoreForm(v, g) : ""}</section>
    ${owed.length ? `<section class="panel"><h2>Add a game for someone</h2><form id="agame" class="cols"><label>Player (round ${v.yr.open_round})<select id="agp">${owed.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label><label>Game<input id="agn" maxlength="60" autocomplete="off"></label><button style="align-self:end">Add game</button></form></section>` : ""}`;
  },
  history() {
    const vs = S.years.map(y => view(y.year)), t = S.people.map(p => { const m = vs.map(v => v.board.find(b => b.p.id === p.id)).filter(Boolean); return { p, titles: vs.filter(v => v.champs.some(c => c.id === p.id)).length, wins: m.reduce((s, b) => s + b.wins, 0), pts: m.reduce((s, b) => s + b.pts, 0), games: m.reduce((s, b) => s + b.games, 0) }; }).sort((a, b) => b.titles - a.titles || b.wins - a.wins || b.pts - a.pts || a.p.name.localeCompare(b.p.name));
    return `<section><h1>Family history</h1><div class="panel"><h2>Champions</h2><ul class="list">${vs.map(v => `<li><span class="place">${v.yr.year}</span><span class="gn">${v.done ? esc(names(v.champs)) : v.played.length ? "In progress" : "Not started"}</span>${v.done ? `<span class="tag push">${plural(v.board[0].pts, "point")}</span>` : ""}</li>`).join("")}</ul></div></section><section class="panel"><h2>All time</h2><div class="scroll"><table><thead><tr><th>Player</th><th>Titles</th><th>Game wins</th><th>Games</th><th>Points</th></tr></thead><tbody>${t.map(x => `<tr><td><b>${esc(x.p.name)}</b></td><td>${x.titles}</td><td>${x.wins}</td><td>${x.games}</td><td>${x.pts}</td></tr>`).join("")}</tbody></table></div></section>`;
  },
  setup() {
    if (!ui.pin) return pinForm("Setup", "Changing players and rules needs the admin PIN.");
    const y = S.years[0], next = y ? y.year + 1 : new Date().getFullYear();
    const start = `<form id="newyear" class="row"><label style="flex:0 1 150px">Year<input id="ny" type="number" value="${next}" min="2000" max="2200"></label><button class="${y ? "" : "main"}" style="align-self:end">Start tournament</button></form>`;
    if (!y) return `<section class="panel"><h1>Start your first tournament</h1>${start}</section>${backup()}`;
    const v = view(ui.year), used = new Set(S.roster.filter(r => r.year === ui.year).map(r => r.person));
    return `<section class="panel"><h1>${ui.year} players</h1><ul class="list">${S.people.map(p => `<li style="flex-wrap:wrap"><input type="checkbox" id="on-${p.id}" data-do="playing" data-id="${p.id}" ${used.has(p.id) ? "checked" : ""} aria-label="${esc(p.name)} is playing in ${ui.year}">${ui.editing === p.id ? `<form class="row person" data-id="${p.id}" style="flex:1 1 220px"><input type="color" id="c-${p.id}" value="${esc(p.color)}" aria-label="Pawn color"><input id="n-${p.id}" value="${esc(p.name)}" maxlength="30" aria-label="Name" style="flex:1 1 120px;width:auto"><button class="main">Save</button><button type="button" data-do="noedit">Cancel</button></form>` : `${pawn(p.color)}<span class="gn">${esc(p.name)}</span><button class="plain push" data-do="edit" data-id="${p.id}">Change</button>`}</li>`).join("") || `<li class="sub">Nobody yet. Add the first player below.</li>`}</ul>
    <form id="newperson" class="row"><input type="color" id="np-c" value="${COLORS.find(c => !S.people.some(p => p.color === c)) || COLORS[0]}" aria-label="Pawn color"><input id="np-n" maxlength="30" placeholder="Name" aria-label="Name" autocomplete="off" style="flex:1 1 140px;width:auto"><button class="main">Add player</button></form></section>
    <section class="panel"><h2>${ui.year} rules</h2><form id="rules" class="cols"><label>Rounds<input id="rr" type="number" min="1" max="10" value="${v.yr.rounds}"></label><label>Points, from 1st place down<input id="rp" value="${v.yr.points.join(", ")}" autocomplete="off"></label><button style="align-self:end">Save rules</button></form><p class="sub small">Changing the points updates every score this year.</p></section>
    <section class="panel"><h2>Start a new year</h2><p>Past years stay in History.</p>${start}</section>${backup()}<div><button data-do="lock">Lock admin on this device</button></div>`;
  },
  tv() {
    const v = view(ui.year), open = v.yr.open_round;
    return `<div style="align-self:center">${track(v)}</div><div class="side"><a href="#/" aria-label="Leave TV view"><img src="ttog-logo.png" alt="TTOG"></a>${nowCard(v) || `<div class="now"><div class="lbl">${ui.year}</div><div class="name">${v.games.some(g => !g.res.length) ? "Ready to draw" : "Add your games"}</div>${open ? `<div>Round ${open} picks are open</div>` : ""}</div>`}<p class="sub">${v.played.length} of ${plural(v.total, "game")} played</p></div>`;
  }
};
const backup = () => `<section class="panel"><h2>Backup</h2><p>Save a copy of everything after each tournament. Keep the file somewhere safe.</p><div class="row"><button data-do="save">Download backup</button><label class="btn" for="rf">Restore from a file</label><input type="file" id="rf" accept=".json,application/json" style="position:absolute;width:1px;height:1px;min-height:0;opacity:0;padding:0;border:0"></div></section>`;
const pinForm = (t, m) => `<section class="panel" style="max-width:440px"><h1>${t}</h1><p>${m}</p><form id="pin" class="row"><label style="flex:1 1 160px">PIN<input id="pinv" type="password" inputmode="numeric" autocomplete="off"></label><button class="main" style="align-self:end">Unlock</button></form></section>`;
function placesOf(o) { const p = []; o.forEach((x, i) => p[i] = i && x.tie ? p[i - 1] : i + 1); return p; }
function scoreForm(v, g) {
  const p = placesOf(ui.order), left = v.roster.filter(x => !ui.order.some(o => o.person === x.id));
  return `${ui.order.length ? `<ul class="list">${ui.order.map((o, i) => `<li style="flex-wrap:wrap"><span class="place">${ord(p[i])}</span>${pawn(person(o.person).color)}<span class="gn">${esc(person(o.person).name)}</span><span class="tag">${plural(v.yr.points[p[i] - 1] || 0, "point")}</span><span class="push row">${i ? `<button class="plain" data-do="tie" data-i="${i}" aria-pressed="${!!o.tie}">${o.tie ? "Undo tie" : "Tied with above"}</button>` : ""}<button class="plain" data-do="unplace" data-i="${i}" aria-label="Take ${esc(person(o.person).name)} out of the order">Remove</button></span></li>`).join("")}</ul>` : ""}
  ${left.length ? `<div><p><b>${ui.order.length ? `Who came in next?` : "Who won?"}</b> Tap players in the order they finished. Leave out anyone who sat out.</p></div><div class="chips">${left.map(x => `<button data-do="place" data-id="${x.id}">${pawn(x.color)}${esc(x.name)}</button>`).join("")}</div>` : ""}
  <div class="row"><button class="main" data-do="saveres" ${ui.order.length < 2 ? "disabled" : ""}>Save scores</button>${g.res.length ? `<button class="bad push" data-do="clearres">Clear scores</button>` : ""}</div>`;
}

// ---------- Drawing it ----------
const route = () => { const r = location.hash.replace(/^#\/?/, ""); return screens[r] ? r : ""; };
function render(keep) {
  if (!S) return;
  // A background refresh must not wipe something half-typed.
  const drafts = keep ? [...main.querySelectorAll("input[id]:not([type=file]):not([type=checkbox])")].filter(i => i.value !== i.defaultValue).map(i => [i.id, i.value]) : [];
  if (!S.years.some(y => y.year === ui.year)) ui.year = S.years[0]?.year ?? null;
  const r = route(), openD = new Set([...main.querySelectorAll("details[open]")].map(d => d.dataset.k));
  const focus = document.activeElement?.id;
  document.body.classList.toggle("tv", r === "tv" && !!S.years.length);
  $("#nav").innerHTML = [["", "Scores"], ["games", "Games"], ["play", "Play"], ["history", "History"], ["setup", "Setup"]].map(([k, n]) => `<a href="#/${k}" ${k === r ? 'aria-current="page"' : ""}>${n}</a>`).join("");
  $("#yr").innerHTML = S.years.length > 1 ? `<select id="yearsel" aria-label="Year" style="font-family:var(--display)">${S.years.map(y => `<option ${y.year === ui.year ? "selected" : ""}>${y.year}</option>`).join("")}</select>` : ui.year || "";
  main.innerHTML = !S.years.length && r !== "setup" ? `<section class="panel"><h1>No tournament yet</h1><p>Open Setup to start one.</p><div><a class="btn" href="#/setup">Go to Setup</a></div></section>` : screens[r]();
  main.querySelectorAll("details").forEach(d => d.open = openD.has(d.dataset.k));
  drafts.forEach(([id, val]) => { const i = document.getElementById(id); if (i) i.value = val; });
  if (focus) document.getElementById(focus)?.focus();
  reel();
}
// When a new game is drawn, every open screen spins through the choices and lands together.
let spinUntil = 0, seenDraw = null;
function reel() {
  clearInterval(reelTimer);
  const el = main.querySelector("[data-reel]"); if (!el || Date.now() >= spinUntil) return;
  const v = view(ui.year), g = v.cur; if (!g) return;
  const pool = v.games.filter(x => x.round === g.round && !x.res.length), sub = main.querySelector("[data-reel-sub]"), subText = sub.textContent;
  sub.textContent = "Drawing…"; let i = 0;
  const tick = () => { if (Date.now() >= spinUntil) { clearInterval(reelTimer); el.textContent = g.name; sub.textContent = subText; return; } el.textContent = pool[i++ % pool.length].name; };
  tick(); reelTimer = setInterval(tick, 110);
}
async function load(force) {
  try {
    const j = await rpc("tt_state"); $("#offline").hidden = true;
    const { now, ...rest } = j, txt = JSON.stringify(rest);
    const yr = j.years.find(y => y.year === (ui.year ?? j.years[0]?.year)), d = yr?.drawn_at || "";
    if (seenDraw !== null && d && d !== seenDraw && !matchMedia("(prefers-reduced-motion:reduce)").matches) spinUntil = Date.now() + 3200;
    if (yr || seenDraw === null) seenDraw = d;
    const changed = txt !== raw; raw = txt; S = rest;
    const a = document.activeElement, typing = main.contains(a) && /^(INPUT|SELECT)$/.test(a.tagName) && a.type !== "checkbox";
    if (force || (changed && !typing && !$("#dlg").open)) render(!force); else if (changed) raw = "";
  } catch (e) { $("#offline").hidden = false; if (force && S) throw e; }
}
let busy = false;
async function run(fn, msg) {
  if (busy) return; busy = true;
  try { await fn(); document.activeElement?.blur?.(); await load(true); if (msg) toast(msg); }
  catch (e) { toast(e.message, true); render(true); }
  finally { busy = false; }
}
function poll() { clearTimeout(timer); timer = setTimeout(async () => { if (!document.hidden) await load(); poll(); }, 4000); }

// ---------- What buttons do ----------
function openScores(id) { ui.game = id || null; const g = id && view(ui.year).games.find(x => x.id === id); ui.order = g ? g.res.map((r, i) => ({ person: r.person, tie: i > 0 && g.res[i - 1].place === r.place })) : []; render(); }
const acts = {
  draw: () => { ui.game = null; ui.order = []; run(() => admin("tt_draw", { p_year: ui.year })); },
  score: b => { openScores(b.dataset.id); $("#pick")?.scrollIntoView({ block: "center" }); },
  place: b => { ui.order.push({ person: b.dataset.id, tie: false }); render(); },
  unplace: b => { ui.order.splice(+b.dataset.i, 1); if (ui.order[0]) ui.order[0].tie = false; render(); },
  tie: b => { const o = ui.order[+b.dataset.i]; o.tie = !o.tie; render(); },
  saveres: () => { const p = placesOf(ui.order); run(async () => { await admin("tt_save_results", { p_game: ui.game, p_places: ui.order.map((o, i) => ({ person: o.person, place: p[i] })) }); ui.game = null; ui.order = []; }, "Scores saved"); },
  clearres: async () => { if (await ask("Clear these scores?", "The points come off the scoreboard and the game goes back to waiting.", "Clear scores")) run(async () => { await admin("tt_clear_results", { p_game: ui.game }); ui.game = null; ui.order = []; }, "Scores cleared"); },
  delgame: async b => { const g = S.games.find(x => x.id === b.dataset.id); if (g && await ask(`Remove ${g.name}?`, `${person(g.person).name} will need to add another game for round ${g.round}.`, "Remove game")) run(() => admin("tt_delete_game", { p_game: g.id }), "Game removed"); },
  edit: b => { ui.editing = b.dataset.id; render(); document.getElementById((route() === "setup" ? "n-" : "rn-") + ui.editing)?.focus(); },
  noedit: () => { ui.editing = null; render(); },
  lock: () => { setPin(null); render(); toast("Admin locked"); },
  save: () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: "application/json" })); a.download = `ttog-backup-${new Date().toLocaleDateString("en-CA")}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast("Backup downloaded"); },
};
document.addEventListener("click", e => { const b = e.target.closest("[data-do]"); if (b && acts[b.dataset.do]) acts[b.dataset.do](b); });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "yearsel") { ui.year = +t.value; ui.game = null; ui.order = []; seenDraw = yearOf(ui.year).drawn_at || ""; render(); }
  if (t.id === "me") { mem.set("ttog-me", t.value); t.blur(); render(); }
  if (t.id === "pick") { t.blur(); openScores(t.value); }
  if (t.dataset.do === "playing") run(() => admin("tt_set_playing", { p_year: ui.year, p_person: t.dataset.id, p_on: t.checked }));
  if (t.id === "rf" && t.files[0]) {
    let data; try { data = JSON.parse(await t.files[0].text()); } catch { return toast("That is not a TTOG backup file", true); }
    t.value = "";
    if (await ask("Replace everything with this backup?", "Every player, game and score on the site now will be replaced by what's in the file.", "Replace everything")) { ui.year = null; run(() => admin("tt_restore", { p_data: data }), "Backup restored"); }
  }
});
document.addEventListener("submit", e => {
  const f = e.target, val = id => document.getElementById(id).value; if (f.method === "dialog") return; e.preventDefault();
  if (f.id === "pin") { const p = val("pinv").trim(); run(async () => { await rpc("tt_check_pin", { p_pin: p }); setPin(p); }); }
  if (f.id === "submit") { const n = val("gname"); run(async () => { const r = await rpc("tt_submit", { p_person: mem.get("ttog-me"), p_name: n, p_device: device }); mem.set("ttog-mine", JSON.stringify([...mine(), r.id])); }, "Your game is in"); }
  if (f.matches(".rename")) { const n = val("rn-" + f.dataset.id); run(async () => { await rpc("tt_rename_mine", { p_game: f.dataset.id, p_name: n, p_device: device }); ui.editing = null; }, "Name saved"); }
  if (f.matches(".person")) { const id = f.dataset.id, n = val("n-" + id), c = val("c-" + id); run(async () => { await admin("tt_save_person", { p_year: ui.year, p_person: id, p_name: n, p_color: c }); ui.editing = null; }, "Player saved"); }
  if (f.id === "newperson") { const n = val("np-n"), c = val("np-c"); run(() => admin("tt_save_person", { p_year: ui.year, p_person: null, p_name: n, p_color: c }), "Player added").then(() => $("#np-n")?.focus()); }
  if (f.id === "agame") { const p = val("agp"), n = val("agn"), r = yearOf(ui.year).open_round; run(() => admin("tt_admin_game", { p_year: ui.year, p_round: r, p_person: p, p_name: n }), "Game added"); }
  if (f.id === "rules") { const pts = val("rp").split(/[\s,]+/).filter(Boolean).map(Number), r = parseInt(val("rr"), 10); if (pts.some(x => !Number.isInteger(x))) return toast("Points must be whole numbers, like 10, 7, 5, 3, 1", true); run(() => admin("tt_save_year", { p_year: ui.year, p_rounds: r, p_points: pts }), "Rules saved"); }
  if (f.id === "newyear") { const y = parseInt(val("ny"), 10); if (!(y >= 2000 && y <= 2200)) return toast("Type a year, like 2026", true); if (yearOf(y)) return toast(`${y} already exists`, true); const last = S.years[0]; run(async () => { await admin("tt_save_year", { p_year: y, p_rounds: last?.rounds || 3, p_points: last?.points || [10, 7, 5, 3, 1] }); ui.year = y; }, `${y} is ready`); }
});
addEventListener("hashchange", () => { ui.editing = null; document.activeElement?.blur?.(); render(); scrollTo(0, 0); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load(true).then(poll);
</script>
</body>
</html>
